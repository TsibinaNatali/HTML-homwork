<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Добро пожаловать в STEAM</title>
</head>
<body>
    <header class="header-container">
        <div class="left-nav">
            <a href="#" class="logo">
                <img src="img/steam-logo.png" alt="steam-logo">
            </a>
            </div>
            <ul class="main-menu">
                <li class="menu-item"><a href="#"> МАГАЗИН</a></li>
                <li class="menu-item"><a href="#">СООБЩЕСТВО</a></li>
                <li class="menu-item"><a href="#">ИНФОРМАЦИЯ</a></li>
                <li class="menu-item"><a href="#">ПОДДЕРЖКА</a></li>
            </ul>
        </div>
        <div class="action-row">
            <a href="#" class="btn-install">Установить Steam</a>
            <a href="#" class="link-login">вход</a>
            <span href="#" class="divider">|</span>
            <a href="#" class="selector">язык &#9660</a>   
        </div>
        <div class="clearfix"></div>
    </header>
    <nav class="sub=menu-container">
        <div class="sub-menu-content">
             <ul class="sub-menu">
                <li class="sub-item"><a href="#" class="sub-link">Просмотр</a></li>
                <li class="sub-item"><a href="#" class="sub-link">Рекомендации</a></li>
                <li class="sub-item"><a href="#" class="sub-link">Категории</a></li>
                <li class="sub-item"><a href="#" class="sub-link">Способы игры</a></li>
                <li class="sub-item"><a href="#" class="sub-link">Особые разделы</a></li>
            </ul>
            <div class="search-box">
                <input type="text" placeholder="Поиск по магазину">
                <button type="submit"></button>
            </div>
            <div class="clearfix"></div>
        </div>
    </nav>

</html>
